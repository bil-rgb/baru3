name: Build Flutter APK (Fallback Worker)


run-name: Build ${{ inputs.jobId }}

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from Bot'
        required: true
      userId:
        description: 'User ID'
        required: true
      payload:
        description: 'Build Payload (JSON)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Batas keras supaya build yang hang tidak jalan berjam-jam (default GitHub: 360 menit).
    timeout-minutes: 55
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Tune Gradle
        run: |
          mkdir -p "$HOME/.gradle"
          cat >> "$HOME/.gradle/gradle.properties" <<'PROPS'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.daemon=false
          org.gradle.parallel=true
          PROPS

      - name: Prepare Project
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD: ${{ github.event.inputs.payload }}
        run: |
          set -e
          printf '%s' "$PAYLOAD" > payload.json

          if ! jq -e 'type == "object"' payload.json >/dev/null 2>&1; then
            echo "::error::Payload harus berupa JSON object yang valid."
            exit 1
          fi

          MODE=$(jq -r '.mode // "zip"' payload.json)
          if [ "$MODE" != "zip" ]; then
            echo "::error::Workflow ini hanya untuk mode 'zip' (build project Flutter). Mode '$MODE' (mis. Web2APK) butuh workflow lain."
            exit 1
          fi

          BUILD_TYPE=$(jq -r '.buildType // "release"' payload.json)
          case "$BUILD_TYPE" in
            release|debug) ;;
            *) BUILD_TYPE=release ;;
          esac
          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"
          echo "Build type: $BUILD_TYPE"

          ASSET_URL=$(jq -r '.zipAssetUrl // .url // empty' payload.json)
          if [ -z "$ASSET_URL" ]; then
            echo "::error::Tidak ada zipAssetUrl atau url di payload."
            exit 1
          fi

          echo "Downloading project source..."
          rm -rf project project.zip
          mkdir -p project

          if [[ "$ASSET_URL" == *"api.github.com"* ]]; then
            curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" -o project.zip "$ASSET_URL"
          else
            curl -fL -o project.zip "$ASSET_URL"
          fi

          unzip -q project.zip -d project

          PUBSPEC=$(find project -maxdepth 5 -type f -name pubspec.yaml | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml tidak ditemukan di dalam ZIP. Pastikan ini project Flutter yang valid."
            find project -maxdepth 3
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PUBSPEC")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Detected Flutter project root: $PROJECT_ROOT"

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_ROOT"

          echo "::group::flutter pub get"
          flutter pub get
          echo "::endgroup::"

          if grep -q "build_runner" pubspec.yaml; then
            echo "::group::build_runner"
            dart run build_runner build --delete-conflicting-outputs
            echo "::endgroup::"
          fi

          echo "Mulai build $BUILD_TYPE pada $(date -u +%H:%M:%S) UTC"
          flutter build apk --"$BUILD_TYPE"
          echo "Selesai build pada $(date -u +%H:%M:%S) UTC"

      - name: Locate APK
        run: |
          set -e
          APK_PATH=$(find "$PROJECT_ROOT/build/app/outputs" -type f -name "app-${BUILD_TYPE}.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find "$PROJECT_ROOT/build" -type f -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "::error::File APK tidak ditemukan setelah build."
            find "$PROJECT_ROOT/build" -maxdepth 5 2>/dev/null || true
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "Found APK at: $APK_PATH"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          
